name: unpub_aws
description: A collection of modules to use for deploying unpub into AWS infrastructure.
version: 0.2.0
homepage: https://github.com/rpsadarangani/unpub
environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  unpub: ^2.0.0
  minio: ">=3.0.0 <3.5.2"
  http: ^0.13.3
  crypto: ^3.0.0
  convert: ^3.0.0
  xml: ^5.4.1
  json_annotation: ^4.1.0
  collection: ^1.15.0

dev_dependencies:
  lints: ^1.0.0
  test: ^1.17.12
  chunked_stream: ^1.4.1
  mockito: ^5.0.16
  build_runner: ^2.1.2
  json_serializable: ^5.0.0
  path: ^1.8.0

dependency_overrides:
  unpub:
    path: ../unpub
