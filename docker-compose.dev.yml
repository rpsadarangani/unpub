version: "3.8"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/unpub-packages || true
        mc anonymous set none local/unpub-packages

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  ddb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-south-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until aws --endpoint-url http://dynamodb-local:8000 dynamodb list-tables >/dev/null 2>&1; do
          sleep 1
        done
        aws --endpoint-url http://dynamodb-local:8000 dynamodb create-table \
          --table-name unpub-packages \
          --attribute-definitions \
              AttributeName=name,AttributeType=S \
              AttributeName=_all,AttributeType=S \
              AttributeName=updatedAt,AttributeType=S \
              AttributeName=download,AttributeType=N \
          --key-schema AttributeName=name,KeyType=HASH \
          --global-secondary-indexes \
              "IndexName=gsi_updated,KeySchema=[{AttributeName=_all,KeyType=HASH},{AttributeName=updatedAt,KeyType=RANGE}],Projection={ProjectionType=ALL}" \
              "IndexName=gsi_download,KeySchema=[{AttributeName=_all,KeyType=HASH},{AttributeName=download,KeyType=RANGE}],Projection={ProjectionType=ALL}" \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true

  unpub:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      minio-init:
        condition: service_completed_successfully
      ddb-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: ap-south-1
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_DDB_ENDPOINT: http://dynamodb-local:8000
      UNPUB_BUCKET: unpub-packages
      UNPUB_TABLE: unpub-packages
      UNPUB_PORT: "4000"
    ports:
      - "4000:4000"

volumes:
  minio-data:
