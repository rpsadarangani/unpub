name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HELM_OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  docker:
    name: build + push docker (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: package + push helm chart (OCI)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.tag }}"
          else
            raw="${GITHUB_REF##*/}"
          fi
          # Helm chart versions must be SemVer without a leading "v".
          stripped="${raw#v}"
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "version=$stripped" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: pin chart + appVersion to release tag
        run: |
          sed -i "s/^version: .*/version: ${{ steps.tag.outputs.version }}/" charts/unpub/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ steps.tag.outputs.version }}\"/" charts/unpub/Chart.yaml
          # Pin the deployment image to the freshly-published docker tag.
          sed -i "s|tag: \"\"|tag: \"${{ steps.tag.outputs.raw }}\"|" charts/unpub/values.yaml

      - name: helm lint
        run: helm lint charts/unpub

      - name: helm package
        run: helm package charts/unpub -d /tmp/dist

      - name: helm push (OCI -> GHCR)
        run: |
          helm push /tmp/dist/unpub-${{ steps.tag.outputs.version }}.tgz "${{ env.HELM_OCI_REPO }}"
